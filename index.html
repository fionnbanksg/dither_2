<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dither-vox</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: monospace; color: #fff; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #debug { position: fixed; top: 10px; right: 12px; display: none; font-size: 11px; line-height: 1.35;
           text-shadow: 1px 1px 0 #000; pointer-events: none; text-align: right; }
  #debug.on { display: block; }
  #debug pre { margin: 0; font: inherit; }
  #debug canvas { display: block; margin: 6px 0 0 auto; image-rendering: pixelated; }
  #debug .controls { display: grid; gap: 4px; margin-top: 6px; pointer-events: auto; }
  #debug .row { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  #debug .row input[type=range] { width: 130px; margin: 0; }
  #debug .row .val { min-width: 5ch; text-align: right; }
  #hint { position: fixed; bottom: 8px; left: 10px; font-size: 12px; opacity: .6; pointer-events: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="debug"></div>
<div id="hint">F3 debug · drag to orbit · wheel to zoom</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
